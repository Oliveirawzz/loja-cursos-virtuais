<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja de Cursos - Aprenda com a Gente</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <div class="logo">📚 Cursos Online</div>
      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#courses">Cursos</a></li>
        <li><a href="#contact">Contato</a></li>
      </ul>
    </div>
  </nav>

  <!-- Hero Section -->
  <section id="home" class="hero">
    <div class="container">
      <div class="hero-content">
        <h1>Aprenda Novas Habilidades</h1>
        <p>Cursos e produtos digitais de qualidade para transformar sua carreira</p>
        <button class="btn btn-primary" onclick="document.getElementById('courses').scrollIntoView({behavior: 'smooth'})">Explorar Cursos</button>
      </div>
    </div>
  </section>

  <!-- Courses Section -->
  <section id="courses" class="courses">
    <div class="container">
      <h2>Nossos Cursos</h2>
      <div class="courses-grid" id="coursesGrid"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 Loja de Cursos. Todos os direitos reservados.</p>
    </div>
  </footer>

  <!-- Stripe Script -->
  <script src="https://js.stripe.com/v3/"></script>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento Confirmado</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--light-bg);
    }

    .success-container {
      max-width: 500px;
      padding: 3rem;
      text-align: center;
      background: var(--white);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-lg);
    }

    .success-icon {
      font-size: 3.5rem;
      margin-bottom: 1.5rem;
      animation: scaleIn 0.6s ease;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .success-container h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: var(--text-dark);
      font-weight: 700;
    }

    .success-container p {
      font-size: 1rem;
      margin-bottom: 1.5rem;
      color: var(--text-light);
      line-height: 1.6;
    }

    .success-details {
      background: var(--light-bg);
      padding: 1.5rem;
      border-radius: 6px;
      margin-bottom: 2rem;
      text-align: left;
    }

    .success-details p {
      margin: 0.75rem 0;
      font-size: 0.95rem;
    }

    .success-details strong {
      color: var(--text-dark);
    }

    .button-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .back-btn {
      display: inline-block;
      padding: 12px 28px;
      background: var(--accent-color);
      color: var(--white);
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }

    .back-btn:hover {
      background: #7c3aed;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
    }

    .back-btn-secondary {
      background: transparent;
      color: var(--accent-color);
      border: 2px solid var(--accent-color);
    }

    .back-btn-secondary:hover {
      background: var(--accent-color);
      color: var(--white);
    }

    @media (max-width: 480px) {
      .success-container {
        padding: 2rem;
        margin: 20px;
      }

      .success-icon {
        font-size: 2.5rem;
      }

      .success-container h1 {
        font-size: 1.5rem;
      }

      .button-group {
        flex-direction: column;
      }

      .back-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="success-container">
    <div class="success-icon">✅</div>
    <h1>Pagamento Confirmado!</h1>
    <p>Obrigado pela sua compra! Seu acesso foi liberado com sucesso.</p>
    
    <div class="success-details">
      <p><strong>Próximas etapas:</strong></p>
      <p>📧 Verifique seu email para acessar o curso</p>
      <p>🔑 Use suas credenciais para fazer login</p>
      <p>⭐ Comece a aprender agora mesmo</p>
    </div>

    <div class="button-group">
      <a href="/" class="back-btn">Voltar à Loja</a>
      <a href="/" class="back-btn back-btn-secondary">Ir para Meus Cursos</a>
    </div>
  </div>
</body>
</html>
